<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="titleXO">لعبة XO</title>
    <link rel="stylesheet" href="./css/all.min.css">
    <link id="bs-css" rel="stylesheet" href="./css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="./css/style.css">
    <script>
        if (!localStorage.getItem("session")){
            location.replace("./index.html?login=1");
        }
    </script>
</head>
<body>
    <!-- nav -->
    <nav class="navbar navbar-expand-lg" style="background-color: #1c1f2b;">
    <div class="container-fluid ms-5">
        <a class="navbar-brand me-5" href="./index.html" data-i18n="titleHome" style="color: #6d4aff">رُكني | Rokny</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active me-4" aria-current="page" href="./index.html" data-i18n="navHome" style="color: white">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link me-4" href="./guess.html" target="_blank" data-i18n="navGuess" style="color: white">Guess The Number</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="./to-do.html" target="_blank" data-i18n="navTodo" style="color: white">To-Do-List</a>
                </li>
            </ul>
            <div class="navbar-nav me-5">
            <!-- log out -->
            <!-- Button trigger modal -->
                <span id="userName" class="navbar-text me-3 fw-semibold" style="color: #6d4aff"></span>
                <button id="logoutBtn" type="button" class="btn btn-outline-danger me-2" data-i18n="logout" hidden>Log Out</button>
                <button id="langBtn" class="btn btn-outline-secondary me-2" type="button">English</button>
            </div>
        </div>
    </div>
    </nav>
    <!-- XO -->
    <div class="container">
        <h2 data-i18n="xoTitle">⭕❌ لعبة</h2>
        <div id="status" class="mb-3">دور X</div>
        <div id="board">
            <button class="cell" id="cell0" onclick="cellClick(0)"></button>
            <button class="cell" id="cell1" onclick="cellClick(1)"></button>
            <button class="cell" id="cell2" onclick="cellClick(2)"></button>
            <button class="cell" id="cell3" onclick="cellClick(3)"></button>
            <button class="cell" id="cell4" onclick="cellClick(4)"></button>
            <button class="cell" id="cell5" onclick="cellClick(5)"></button>
            <button class="cell" id="cell6" onclick="cellClick(6)"></button>
            <button class="cell" id="cell7" onclick="cellClick(7)"></button>
            <button class="cell" id="cell8" onclick="cellClick(8)"></button>
            <div class="scores d-flex justify-content-center text-center align-items-center gap-4 small">
                <span>X: <b id="scoreX">0</b></span>
                <span><span data-i18n="draws">تعادل</span>: <b id="scoreD">0</b></span>
                <span>O: <b id="scoreO">0</b></span>
            </div>
        </div>
        <button class="reset" onclick="resetGame()" data-i18n="restart">ابدأ من جديد</button>
    </div>
    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./js/main.js"></script>
</body>
</html>
